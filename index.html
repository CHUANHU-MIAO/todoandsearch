<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Todo & Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="titlebar" id="titlebar">
    <div class="app-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M9 11l3 3L22 4"></path>
        <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path>
      </svg>
    </div>
    <span class="app-title">小工具</span>
    <div class="window-controls">
      <button class="ctrl-btn" id="float-btn" title="桌面浮窗">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
      </button>
      <button class="ctrl-btn" id="min-btn" title="最小化">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect y="5" width="12" height="2" fill="currentColor"/></svg>
      </button>
      <button class="ctrl-btn ctrl-close" id="close-btn" title="隐藏到托盘">
        <svg width="12" height="12" viewBox="0 0 12 12">
          <path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="2"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="todo">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 11l3 3L22 4"></path>
        <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path>
      </svg>
      待办
    </button>
    <button class="tab" data-tab="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="M21 21l-4.35-4.35"></path>
      </svg>
      搜索
    </button>
    <button class="tab" data-tab="calendar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      月视图
    </button>
  </div>

  <div class="content">
    <div class="tab-content active" id="tab-todo">
      <div class="todo-input-row">
        <div class="color-picker" id="colorPicker">
          <span class="color-dot" data-color="#8e8e93" style="background:#8e8e93" title="默认"></span>
          <span class="color-dot" data-color="#34c759" style="background:#34c759" title="工作"></span>
          <span class="color-dot" data-color="#007aff" style="background:#007aff" title="学习"></span>
          <span class="color-dot" data-color="#af52de" style="background:#af52de" title="个人"></span>
          <span class="color-dot" data-color="#ffcc00" style="background:#ffcc00" title="提醒"></span>
          <span class="color-dot" data-color="#ff9500" style="background:#ff9500" title="重要"></span>
          <span class="color-dot" data-color="#ff3b30" style="background:#ff3b30" title="紧急"></span>
          <span class="color-dot" data-color="#ff2d55" style="background:#ff2d55" title="生活"></span>
        </div>
        <div class="input-wrap">
          <input type="text" id="todoInput" placeholder="添加待办..." maxlength="200">
          <button id="addTodoBtn">添加</button>
        </div>
      </div>
      <div class="todo-stats">
        <span id="todoCount">0 项</span>
        <div class="filter-group">
          <button class="filter-btn active" data-filter="all">全部</button>
          <button class="filter-btn" data-filter="active">进行中</button>
          <button class="filter-btn" data-filter="completed">已完成</button>
        </div>
      </div>
      <div class="todo-list" id="todoList"></div>
    </div>

    <div class="tab-content" id="tab-search">
      <div class="search-input-row">
        <div class="input-wrap">
          <input type="text" id="searchInput" placeholder="输入文件名搜索..." autocomplete="off">
          <button id="searchBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="M21 21l-4.35-4.35"></path>
            </svg>
          </button>
        </div>
      </div>
      <div class="search-status" id="searchStatus">输入文件名开始搜索</div>
      <div class="search-results" id="searchResults"></div>
    </div>

    <div class="tab-content" id="tab-calendar">
      <div class="cal-header">
        <button class="cal-nav-btn" id="calPrev">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span class="cal-title" id="calTitle"></span>
        <button class="cal-nav-btn" id="calNext">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
        <button class="cal-today-btn" id="calToday">今天</button>
      </div>
      <div class="cal-grid-wrap">
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-day-detail" id="calDayDetail">
          <div class="cal-detail-header">
            <button class="cal-back-btn" id="calBack">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
              返回
            </button>
            <span class="cal-detail-title" id="calDetailTitle"></span>
          </div>
          <div class="cal-detail-scroll" id="calDetailScroll">
            <div class="cal-detail-section" id="calDetailCreated">
              <div class="cal-detail-section-title">新增</div>
              <div class="cal-detail-list" id="calDetailCreatedList"></div>
            </div>
            <div class="cal-detail-section" id="calDetailDone">
              <div class="cal-detail-section-title">完成</div>
              <div class="cal-detail-list" id="calDetailDoneList"></div>
            </div>
          </div>
          <div class="cal-detail-empty" id="calDetailEmpty">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path></svg>
            这一天没有待办活动
          </div>
        </div>
      </div>
      <div class="cal-footer" id="calFooter">
        <span>新增 <strong id="calCreatedCount">0</strong></span>
        <span class="cal-footer-divider"></span>
        <span>完成 <strong id="calDoneCount">0</strong></span>
        <span class="cal-footer-divider"></span>
        <span>未完成 <strong id="calPendingCount">0</strong></span>
      </div>
    </div>
  </div>

  <div class="context-menu" id="contextMenu">
    <div class="menu-item" data-action="open">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      打开文件
    </div>
    <div class="menu-item" data-action="folder">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"></path></svg>
      打开所在文件夹
    </div>
    <div class="menu-divider"></div>
    <div class="menu-item" data-action="copy-path">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path></svg>
      复制路径
    </div>
    <div class="menu-item" data-action="copy-file">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path></svg>
      复制文件
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
