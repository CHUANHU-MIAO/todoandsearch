name: 鏋勫缓涓庡彂甯?
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 妫€鍑轰唬鐮?        uses: actions/checkout@v4

      - name: 瀹夎 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 瀹夎渚濊禆
        run: npm ci

      - name: 鐢熸垚鍥炬爣
        run: node scripts/generate-icon.js

      - name: 鏋勫缓 Windows 瀹夎鍖?        run: npm run dist:win
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 涓婁紶鏋勫缓浜х墿锛圓rtifact锛?        uses: actions/upload-artifact@v4
        with:
          name: TodoSearch-Windows
          path: |
            release/*.exe
            release/*.yml
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 涓嬭浇鏋勫缓浜х墿
        uses: actions/download-artifact@v4
        with:
          name: TodoSearch-Windows
          path: release/

      - name: 鍒涘缓 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.yml
          generate_release_notes: true
          body: |
            ## TodoSearch v${{ github.ref_name }}

            妗岄潰鎮诞寰呭姙娓呭崟涓庢枃浠舵悳绱㈠伐鍏枫€?
            ### 涓嬭浇
            - `*-x64.exe` 鈥?NSIS 瀹夎鐗?            - `*-x64-portable.exe` 鈥?渚挎惡鐗堬紝鏃犻渶瀹夎
          fail_on_unmatched_files: false
